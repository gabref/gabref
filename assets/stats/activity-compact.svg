<svg xmlns="http://www.w3.org/2000/svg" width="400" height="332" viewBox="0 0 400 332" role="img" aria-labelledby="title">
<title id="title">GitHub activity overview, compact layout</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121C2D"/><stop offset="1" stop-color="#0B111D"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#53E1C1"/><stop offset="1" stop-color="#8B9CFF"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#EDF3FF}.muted{fill:#9AABC4}.accent{fill:#53E1C1}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700}.heading{font-size:25px;font-weight:700}.value{font-size:48px;font-weight:700;letter-spacing:-1px}</style>
<rect x=".5" y=".5" width="399" height="331" rx="18" fill="url(#bg)" stroke="#29364C"/>
<text x="24" y="33" class="accent eyebrow">GITHUB / ACTIVITY</text><text x="24" y="65" class="muted" font-size="13">Public + private · past 30 days</text><text x="24" y="121" font-size="36" font-weight="700">131</text><text x="24" y="145" class="muted" font-size="13">Authored commits</text><text x="214" y="121" font-size="36" font-weight="700">21</text><text x="214" y="145" class="muted" font-size="13">Active days</text><text x="24" y="205" font-size="36" font-weight="700">15</text><text x="24" y="229" class="muted" font-size="13">PRs opened</text><text x="214" y="205" font-size="36" font-weight="700">32</text><text x="214" y="229" class="muted" font-size="13">Commits / last 7 days</text><path d="M24 255H376" stroke="#29364C"/><text x="24" y="281" class="muted" font-size="12">51 public + 57 private owned repos</text><text x="24" y="309" class="muted" font-size="11">Updated 12 Nov 2026</text>
</svg>
